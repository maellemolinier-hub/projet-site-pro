name: CI/CD ImmoExpert

on:
  push:
    branches: [main, claude/railway-npgdq8]
  pull_request:
    branches: [main]

env:
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # ─────────────────────────────────────────────
  # 1. Lint + Type check
  # ─────────────────────────────────────────────
  lint:
    name: Lint & Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check Next.js
        run: pnpm --filter @immoexpert/web exec tsc --noEmit

  # ─────────────────────────────────────────────
  # 2. Build Next.js
  # ─────────────────────────────────────────────
  build-web:
    name: Build Next.js
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @immoexpert/db exec prisma generate

      - name: Build
        run: pnpm --filter @immoexpert/web build

  # ─────────────────────────────────────────────
  # 3. Deploy Next.js → Vercel
  # ─────────────────────────────────────────────
  deploy-web:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: build-web
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Deploy to Vercel
        run: |
          npx vercel --token=${{ secrets.VERCEL_TOKEN }} \
            --prod \
            --yes \
            --cwd apps/web
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ─────────────────────────────────────────────
  # 4. Build & test Python API
  # ─────────────────────────────────────────────
  build-api:
    name: Python API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          cd apps/api
          pip install -r requirements.txt

      - name: Lint with ruff
        run: |
          pip install ruff
          ruff check apps/api --ignore E501

  # ─────────────────────────────────────────────
  # 5. Deploy API + workers → Railway
  # ─────────────────────────────────────────────
  deploy-api:
    name: Deploy ${{ matrix.service }} to Railway
    runs-on: ubuntu-latest
    needs: build-api
    if: github.ref == 'refs/heads/main'
    strategy:
      matrix:
        include:
          - service: api
            config: railway.toml
          - service: celery-worker
            config: infra/railway-worker.toml
          - service: celery-beat
            config: infra/railway-beat.toml
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy ${{ matrix.service }}
        run: railway up --service ${{ matrix.service }} --config ${{ matrix.config }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────
  # 6. Prisma migrate on main
  # ─────────────────────────────────────────────
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    needs: deploy-web
    if: github.ref == 'refs/heads/main'
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run migrations
        run: pnpm --filter @immoexpert/db exec prisma migrate deploy
